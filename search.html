<body>

    ====================================================== -->

    <!-- =====================================================
         SEARCH PAGE
    ====================================================== -->

    <main class="search-page">


        <!-- =================================================
             SEARCH HEADER
        ================================================== -->

        <section class="search-header">


            <div class="search-heading">


                <p>
                    KLT / SEARCH

                    FIND

                    YOUR PIECE.

                </h1>


            </div>



            <div class="search-input-wrap">


                <span>
                    ⌕
                </span>


                <input
                    type="text"
                    id="searchInput"
                    placeholder="What are you looking for?"
                    autocomplete="off"
                >


                <button
                    type="button"
                    id="clearSearch"
                    aria-label="Clear search"
                >
                    ×
                </button>


            </div>


        </section>




        <!-- =================================================
             EXPLORE
        ================================================== -->

        <section
            class="search-trending"
            id="trendingSection"
        >


            <div class="search-section-label">


                <span>
                    EXPLORE
                </span>


                <span>
                    KLT / 01
                </span>


            </div>



            <div class="search-tags">


                <button
                    type="button"
                    data-search="menswear"
                >
                    MENSWEAR
                </button>


                <button
                    type="button"
                    data-search="womenswear"
                >
                    WOMENSWEAR
                </button>


                <button
                    type="button"
                    data-search="knit"
                >
                    KNIT
                </button>


                <button
                    type="button"
                    data-search="jacket"
                >
                    JACKETS
                </button>


                <button
                    type="button"
                    data-search="denim"
                >
                    DENIM
                </button>


                <button
                    type="button"
                    data-search="sale"
                >
                    SALE
                </button>


            </div>


        </section>




        <!-- =================================================
             RESULTS
        ================================================== -->

        <section
            class="search-results-section"
            id="resultsSection"
        >


            <div class="search-results-heading">


                <div>


                    <p>
                        RESULTS
                    </p>


                    <h2 id="resultsTitle">
                        ALL PIECES
                    </h2>


                </div>


                <span id="resultsCount">
                    18 PIECES
                </span>


            </div>



            <div
                class="search-results-grid"
                id="resultsGrid"
            >
            </div>


        </section>




        <!-- =================================================
             NO RESULTS
        ================================================== -->

        <section
            class="search-empty"
            id="searchEmpty"
        >


            <p>
                KLT / NO MATCH
            </p>


            <h2>

                NOTHING
                <br>
                FOUND.

            </h2>


            <span>
                Try another word or explore the collection.
            </span>


            <button
                type="button"
                id="showAll"
            >
                VIEW ALL PIECES →
            </button>


        </section>


    </main>




    <!-- =====================================================
         FOOTER
    ====================================================== -->

        <div>

        /* =====================================================
           ELEMENTS
        ====================================================== */

        const searchInput =
            document.getElementById(
                "searchInput"
            );


        const clearSearch =
            document.getElementById(
                "clearSearch"
            );


        const resultsGrid =
            document.getElementById(
                "resultsGrid"
            );


        const resultsCount =
            document.getElementById(
                "resultsCount"
            );


        const resultsTitle =
            document.getElementById(
                "resultsTitle"
            );


        const searchEmpty =
            document.getElementById(
                "searchEmpty"
            );


        const resultsSection =
            document.getElementById(
                "resultsSection"
            );


        const showAll =
            document.getElementById(
                "showAll"
            );




        /* =====================================================
           DISPLAY PRODUCTS
        ====================================================== */

        function displayProducts(
            items,
            title = "ALL PIECES"
        ) {


            resultsGrid.innerHTML =
                "";


            resultsTitle.textContent =
                title;


            resultsCount.textContent =
                items.length +
                (
                    items.length === 1
                        ? " PIECE"
                        : " PIECES"
                );


            /* ================= NO RESULTS ================= */

            if (items.length === 0) {


                resultsSection.style.display =
                    "none";


                searchEmpty.style.display =
                    "flex";


                return;

            }


            /* ================= RESULTS ================= */

            resultsSection.style.display =
                "block";


            searchEmpty.style.display =
                "none";



            items.forEach(
                function (product) {


                    const card =
                        document.createElement(
                            "article"
                        );


                    card.className =
                        "search-product-card";


                    card.innerHTML = `

                        <a
                            href="product.html?product=${product.id}"
                            class="search-product-link"
                        >

                            <div class="search-product-image">


                                <img
                                    src="${product.image}"
                                    alt="${product.name}"
                                >


                                <span>
                                    ${product.category}
                                </span>


                            </div>


                            <div class="search-product-info">


                                <h3>
                                    ${product.name}
                                </h3>


                                <strong>
                                    ${product.price}
                                </strong>


                            </div>


                        </a>

                    `;


                    resultsGrid.appendChild(
                        card
                    );

                }
            );

        }




        /* =====================================================
           SEARCH
        ====================================================== */

        function performSearch(value) {


            const query =
                value
                    .trim()
                    .toLowerCase();


            if (!query) {


                displayProducts(
                    products,
                    "ALL PIECES"
                );


                return;

            }


            const filtered =
                products.filter(
                    function (product) {


                        const searchableText =
                            (
                                product.name +
                                " " +
                                product.category +
                                " " +
                                product.type
                            ).toLowerCase();


                        return searchableText.includes(
                            query
                        );

                    }
                );


            displayProducts(
                filtered,
                "SEARCH RESULTS"
            );

        }




        /* =====================================================
           LIVE SEARCH
        ====================================================== */

        searchInput.addEventListener(
            "input",
            function () {

                performSearch(
                    this.value
                );

            }
        );




        /* =====================================================
           SEARCH TAGS
        ====================================================== */

        document
            .querySelectorAll(
                ".search-tags button"
            )
            .forEach(
                function (button) {


                    button.addEventListener(
                        "click",
                        function () {


                            const value =
                                this.dataset.search;


                            searchInput.value =
                                value;


                            performSearch(
                                value
                            );


                            window.scrollTo({

                                top:
                                    resultsSection.offsetTop - 50,

                                behavior:
                                    "smooth"

                            });

                        }
                    );

                }
            );




        /* =====================================================
           CLEAR SEARCH
        ====================================================== */

        clearSearch.addEventListener(
            "click",
            function () {


                searchInput.value =
                    "";


                searchInput.focus();


                displayProducts(
                    products,
                    "ALL PIECES"
                );

            }
        );




        /* =====================================================
           SHOW ALL
        ====================================================== */

        showAll.addEventListener(
            "click",
            function () {


                searchInput.value =
                    "";


                displayProducts(
                    products,
                    "ALL PIECES"
                );


                window.scrollTo({

                    top:
                        resultsSection.offsetTop - 50,

                    behavior:
                        "smooth"

                });

            }
        );




        /* =====================================================
           INITIAL LOAD
        ====================================================== */

        displayProducts(
            products,
            "ALL PIECES"
        );


    </script>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KLT — Wishlist</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- ================= NAVBAR ================= -->

    <header class="shop-navbar">

        <a href="index.html" class="shop-logo">
            KLT
        </a>


        <nav class="shop-nav">

            <a href="mens.html">
                MENSWEAR
            </a>

            <a href="womens.html">
                WOMENSWEAR
            </a>

            <a href="sale.html">
                SALE
            </a>

            <a href="discover.html">
                DISCOVER
            </a>

        </nav>


        <div class="shop-actions">

            <div class="shop-search">

                <span>⌕</span>

                <span>
                    Search
                </span>

            </div>


            <button
                type="button"
                class="wishlist-nav-button"
                aria-label="Wishlist"
            >
                ♡
            </button>


            <button
                type="button"
                class="bag-nav-button"
                aria-label="Shopping bag"
            >
                ♧
            </button>

        </div>

    </header>




    <!-- ================= WISHLIST ================= -->

    <main class="wishlist-page">


        <!-- ================= HEADER ================= -->

        <section class="wishlist-header">

            <div>

                <p>
                    KLT / 05
                </p>

                <h1>
                    WISHLIST
                </h1>

            </div>


            <span id="wishlistCount">
                0 ITEMS
            </span>

        </section>




        <!-- ================= PRODUCTS ================= -->

        <section
            class="wishlist-grid"
            id="wishlistGrid"
        >
        </section>




        <!-- ================= EMPTY ================= -->

        <section
            class="empty-wishlist"
            id="emptyWishlist"
        >

            <p>
                KLT / SAVED PIECES
            </p>


            <h2>
                KEEP
                <br>
                WHAT YOU LOVE.
            </h2>


            <span>
                Save pieces here and come back to them later.
            </span>


            <a href="mens.html">
                EXPLORE COLLECTION →
            </a>

        </section>


    </main>




    <!-- ================= FOOTER ================= -->

    <footer class="shop-footer">


        <div class="footer-logo">
            KLT
        </div>


        <div>

            <p>MENSWEAR</p>

            <p>WOMENSWEAR</p>

            <p>SALE</p>

        </div>


        <div>

            <p>DISCOVER</p>

            <p>CONTACT</p>

            <p>INSTAGRAM</p>

        </div>


        <div class="footer-big">

            FOR
            <br>
            EVERYONE.

        </div>


    </footer>




    <!-- ================= WISHLIST SCRIPT ================= -->

    <script>


        /* =====================================================
           GET WISHLIST
        ====================================================== */

        let wishlist =
            JSON.parse(
                localStorage.getItem("kltWishlist")
            ) || [];



        const wishlistGrid =
            document.getElementById("wishlistGrid");


        const emptyWishlist =
            document.getElementById("emptyWishlist");


        const wishlistCount =
            document.getElementById("wishlistCount");




        /* =====================================================
           UPDATE WISHLIST
        ====================================================== */

        function updateWishlist() {


            wishlistGrid.innerHTML = "";


            wishlistCount.textContent =
                wishlist.length +
                (
                    wishlist.length === 1
                        ? " ITEM"
                        : " ITEMS"
                );


            if (wishlist.length === 0) {

                wishlistGrid.style.display =
                    "none";

                emptyWishlist.style.display =
                    "flex";

                return;

            }


            wishlistGrid.style.display =
                "grid";

            emptyWishlist.style.display =
                "none";




            /* ================= PRODUCTS ================= */

            wishlist.forEach(
                (item, index) => {


                    const card =
                        document.createElement("article");


                    card.className =
                        "wishlist-card";


                    card.innerHTML = `

                        <div class="wishlist-image">

                            <a
                                href="product.html?product=${item.id}"
                            >

                                <img
                                    src="${item.image}"
                                    alt="${item.name}"
                                >

                            </a>


                            <button
                                class="wishlist-remove"
                                type="button"
                                data-index="${index}"
                            >
                                ×
                            </button>

                        </div>


                        <div class="wishlist-info">


                            <div>

                                <p>
                                    KLT / SAVED
                                </p>


                                <h2>
                                    ${item.name}
                                </h2>

                            </div>


                            <strong>
                                ${item.price}
                            </strong>


                        </div>


                        <div class="wishlist-actions">


                            <a
                                href="product.html?product=${item.id}"
                            >
                                VIEW PRODUCT →
                            </a>


                            <button
                                type="button"
                                class="wishlist-bag"
                                data-index="${index}"
                            >
                                ADD TO BAG
                            </button>


                        </div>

                    `;


                    wishlistGrid.appendChild(card);

                }
            );

        }




        /* =====================================================
           REMOVE FROM WISHLIST
        ====================================================== */

        wishlistGrid.addEventListener(
            "click",
            function(event) {


                const removeButton =
                    event.target.closest(
                        ".wishlist-remove"
                    );


                if (!removeButton) {

                    return;

                }


                const index =
                    Number(
                        removeButton.dataset.index
                    );


                wishlist.splice(index, 1);


                localStorage.setItem(
                    "kltWishlist",
                    JSON.stringify(wishlist)
                );


                updateWishlist();

            }
        );




        /* =====================================================
           ADD WISHLIST ITEM TO BAG
        ====================================================== */

        wishlistGrid.addEventListener(
            "click",
            function(event) {


                const bagButton =
                    event.target.closest(
                        ".wishlist-bag"
                    );


                if (!bagButton) {

                    return;

                }


                const index =
                    Number(
                        bagButton.dataset.index
                    );


                const item =
                    wishlist[index];


                let bag =
                    JSON.parse(
                        localStorage.getItem("kltBag")
                    ) || [];


                /*
                    Wishlist does not have a selected size,
                    so send the user to the product page
                    where they can choose one.
                */

                window.location.href =
                    "product.html?product=" +
                    item.id;

            }
        );




        /* =====================================================
           NAVIGATION
        ====================================================== */

        document
            .querySelector(".bag-nav-button")
            .addEventListener(
                "click",
                function() {

                    window.location.href =
                        "bag.html";

                }
            );


        document
            .querySelector(".wishlist-nav-button")
            .addEventListener(
                "click",
                function() {

                    window.location.href =
                        "wishlist.html";

                }
            );




        /* =====================================================
           INITIAL LOAD
        ====================================================== */

        updateWishlist();


    </script>


</body>

</html>

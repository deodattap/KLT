<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KLT</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- ================= NAVBAR ================= -->

    <header class="navbar">

        <div class="logo">
            <span>PUREM</span>
            <span>ODA</span>
        </div>


        <nav>

            <a href="mens.html">MENSWEAR</a>
            <a href="womens.html">WOMENSWEAR</a>
            <a href="sale.html">SALE</a>
            <a href="discover.html">DISCOVER</a>

        </nav>


        <div class="nav-right">

            <div class="search">
                <span>⌕</span>
                <span>Search</span>
            </div>

            <button>♡</button>

            <button>♧</button>

        </div>

    </header>



    <!-- ================= MAIN ================= -->

    <main class="container">


        <!-- LEFT COLUMN -->

        <div class="left-column">


            <!-- TEXT CARD -->

            <section class="text-card">

                <div class="heading">

                    <div class="first-line">

                        <h1>FOR</h1>

                        <span class="arrow">→</span>

                    </div>


                    <h1>EVERYONE BUT</h1>

                    <h1>NOT ANYONE</h1>

                </div>


                <p>

                    We establish personal relationships with our boutiques,
                    to make sure each is vetted for a stress-free shopping
                    experience

                </p>

            </section>



            <!-- SMALL CARDS -->

            <div class="small-cards">


                <!-- CARD 2 -->

                <section class="small-card">

                    <img
                        src="assets/2.jpg"
                        alt="Fashion"
                    >

                    <div class="card-title">
                        #RIP STOP
                    </div>

                </section>



                <!-- CARD 3 -->

                <section class="small-card">

                    <img
                        src="assets/3.jpg"
                        alt="Fashion"
                    >

                    <div class="card-title">
                        #INSULATED
                    </div>

                </section>


            </div>


        </div>



        <!-- RIGHT COLUMN -->

        <section class="hero">


            <img
                src="assets/1.jpg"
                alt="Fashion model"
            >


            <!-- SHOP BUTTON -->

            <button class="shop-button">

                <span>SHOP</span>
                <span>NOW</span>

            </button>



            <!-- HERO BOTTOM BUTTONS -->

            <div class="hero-actions">


                <button class="learn-button">

                    <span>LEARN MORE</span>

                    <b>↓</b>

                </button>



                <button class="contact-button">

                    <span>CONTACT US</span>

                    <b>✉</b>

                </button>


            </div>


        </section>


    </main>


    <script src="script.js"></script>

</body>

</html>

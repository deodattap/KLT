<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KLT</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- ================= NAVBAR ================= -->

    <header class="navbar">


        <a href="index.html" class="logo">
            KLT
        </a>



        <nav>

            <a href="mens.html">
                MENSWEAR
            </a>

            <a href="womens.html">
                WOMENSWEAR
            </a>

            <a href="sale.html">
                SALE
            </a>

            <a href="discover.html">
                DISCOVER
            </a>

        </nav>



        <div class="nav-right">


            <!-- SEARCH -->

            <button
                type="button"
                class="search"
                onclick="window.location.href='search.html'"
                aria-label="Search"
            >

                <span>⌕</span>

                <span>
                    Search
                </span>

            </button>



            <!-- WISHLIST -->

            <button
                type="button"
                aria-label="Wishlist"
                onclick="window.location.href='wishlist.html'"
            >

                ♡

            </button>



            <!-- SHOPPING BAG -->

            <button
                type="button"
                aria-label="Shopping Bag"
                onclick="window.location.href='bag.html'"
            >

                ♧

            </button>


        </div>


    </header>




    <!-- ================= MAIN ================= -->

    <main class="container">


        <!-- ================= LEFT COLUMN ================= -->

        <div class="left-column">


            <!-- TEXT CARD -->

            <section class="text-card">


                <div class="heading">


                    <div class="first-line">

                        <h1>
                            FOR
                        </h1>

                        <span class="arrow">
                            →
                        </span>

                    </div>


                    <h1>
                        EVERYONE BUT
                    </h1>


                    <h1>
                        NOT ANYONE
                    </h1>


                </div>


                <p>

                    We establish personal relationships with our boutiques,
                    to make sure each is vetted for a stress-free shopping
                    experience.

                </p>


            </section>




            <!-- SMALL IMAGE CARDS -->

            <div class="small-cards">


                <!-- IMAGE 2 -->

                <section class="small-card">


                    <img
                        src="assets/2.jpg"
                        alt="KLT fashion"
                    >


                    <div class="card-title">

                        #RIP STOP

                    </div>


                </section>




                <!-- IMAGE 3 -->

                <section class="small-card">


                    <img
                        src="assets/3.jpg"
                        alt="KLT fashion"
                    >


                    <div class="card-title">

                        #INSULATED

                    </div>


                </section>


            </div>


        </div>




        <!-- ================= RIGHT HERO ================= -->

        <section class="hero">


            <img
                src="assets/1.jpg"
                alt="KLT fashion collection"
            >



            <!-- SHOP BUTTON -->

            <button
                class="shop-button"
                type="button"
                onclick="window.location.href='mens.html'"
            >

                <span>
                    SHOP
                </span>

                <span>
                    NOW
                </span>

            </button>




            <!-- HERO ACTIONS -->

            <div class="hero-actions">


                <button
                    class="learn-button"
                    type="button"
                    onclick="window.location.href='discover.html'"
                >

                    <span>
                        LEARN MORE
                    </span>

                    <b>
                        ↓
                    </b>

                </button>



                <button
                    class="contact-button"
                    type="button"
                    onclick="window.location.href='discover.html'"
                >

                    <span>
                        CONTACT US
                    </span>

                    <b>
                        ✉
                    </b>

                </button>


            </div>


        </section>


    </main>




    <script src="script.js"></script>


</body>

</html>

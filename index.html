<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KLT</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="page">

        <!-- NAVBAR -->
        <header class="navbar">

            <div class="logo">
                <span>PUREM</span>
                <span>ODA</span>
            </div>

            <nav>
                <a href="#">WOMENSWEAR</a>
                <a href="#">MENSWEAR</a>
                <a href="#">KIDS</a>
                <a href="#">SALE</a>
                <a href="#">DISCOVER</a>
            </nav>

            <div class="actions">

                <div class="search">
                    <span>⌕</span>
                    <span>Search</span>
                </div>

                <button>♡</button>
                <button>♧</button>

            </div>

        </header>


        <!-- WEBSITE CONTENT -->
        <main class="layout">

            <!-- LEFT TEXT SECTION -->
            <section class="intro">

                <div class="title">

                    <h1>FOR</h1>

                    <div class="arrow">→</div>

                    <h1>EVERYONE BUT</h1>

                    <h1>NOT ANYONE</h1>

                </div>

                <p>
                    We establish personal relationships with our boutiques,
                    to make sure each is vetted for a stress-free shopping
                    experience
                </p>

            </section>


            <!-- LARGE IMAGE -->
            <section class="hero">

                <img src="assets/1.jpg" alt="Main fashion image">

                <button class="shop">
                    SHOP<br>
                    NOW
                </button>

                <div class="hero-buttons">

                    <button class="learn">
                        LEARN MORE
                        <span>↓</span>
                    </button>

                    <button class="contact">
                        CONTACT US
                        <span>✉</span>
                    </button>

                </div>

            </section>


            <!-- BOTTOM LEFT IMAGE -->
            <section class="small-card">

                <img src="assets/2.jpg" alt="Fashion image">

                <h2>#RIP STOP</h2>

            </section>


            <!-- BOTTOM RIGHT IMAGE -->
            <section class="small-card">

                <img src="assets/3.jpg" alt="Fashion image">

                <h2>#INSULATED</h2>

            </section>

        </main>

    </div>

</body>
</html>
